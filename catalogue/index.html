<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetNest - Catalogue</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <body>

  <main>
    <div class="back">
      <h1>Boutique-Chiens</h1>
      <p>Alimentation, accessoires, hygiène et jouets sélectionnés par notre équipe.</p>
    </div>
  <section class="Catalogue">

    <aside class="filterCatalogue">
      <div class="button-j">
    <h4>Animal</h4>
    <button>Tous</button> <button>Chiens</button>
    <button>Chats</button> <button>Rongeur</button>
    <button>Oiseaux</button> <button>Poissons</button>
  </div>

  <div class="frange">
    <h3><label for="range">Prix</label></h3>
    <input type="range" id="range" min="0" max="100" value="100">
    <div class="ESPACE">
      <p>0 €</p>
      <p>100 €</p>
    </div>
  </div>

      <button class="normal">Réinitialiser les filtres</button>
      </aside>

    <div class="catalogue-products">
      <div class="top-sort">
    <div class="sort-box">
      <label for="sort">Trier par</label>
      <select id="sort">
        <option>Prix croissant</option>
        <option>Prix décroissant</option>
      </select>
    </div>
  </div>

  <div class="bar">
    <span class="product-NUM">6 produits affichés (aria-live)</span>
  </div>
    </div>
    

  </section>
</body>
</html>
